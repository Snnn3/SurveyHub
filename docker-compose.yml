services:
  db:
    image: postgres:16-alpine
    container_name: surveyhub-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: surveyhub
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d surveyhub"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 2s
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: surveyhub-app
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: "postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/surveyhub?schema=public"
      DATABASE_URL_TEST: "postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/surveyhub_test?schema=public"
      JWT_SECRET: ${JWT_SECRET:-dev-compose-local-secret-cpe334}
      JWT_EXPIRES_IN: "8h"
      CLIENT_ORIGIN: "http://localhost:4000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
    name: surveyhub_postgres_data
