name: Deploy SurveyHub

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      image_tag:
        description: Full commit SHA of an existing image for rollback; leave empty to deploy main
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: deploy-surveyhub
  cancel-in-progress: false

jobs:
  test:
    if: github.ref == 'refs/heads/main' && !inputs.image_tag
    uses: ./.github/workflows/ci-docker.yml

  deploy:
    needs: test
    if: >-
      always() && !cancelled() && github.ref == 'refs/heads/main' &&
      (needs.test.result == 'success' ||
       (github.event_name == 'workflow_dispatch' && inputs.image_tag != '' && needs.test.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      TEAM_PREFIX: ${{ vars.TEAM_PREFIX }}
      ARTIFACT_REPOSITORY: ${{ vars.ARTIFACT_REPOSITORY }}
      IMAGE_NAME: ${{ vars.IMAGE_NAME }}
      SERVICE_NAME: ${{ vars.SERVICE_NAME }}
      MIGRATION_JOB_NAME: ${{ vars.MIGRATION_JOB_NAME }}
      WIF_PROVIDER: ${{ vars.WIF_PROVIDER }}
      WIF_SERVICE_ACCOUNT: ${{ vars.WIF_SERVICE_ACCOUNT }}
      IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
      ROLLBACK: ${{ inputs.image_tag != '' }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate team resource configuration
        run: |
          test -n "$PROJECT_ID"
          test -n "$REGION"
          test -n "$TEAM_PREFIX"
          test -n "$WIF_PROVIDER"
          test -n "$WIF_SERVICE_ACCOUNT"
          [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]] || { echo "IMAGE_TAG must be a full commit SHA." >&2; exit 1; }

      - name: Authenticate to Google Cloud with Workload Identity Federation
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Build and push the commit image
        if: env.ROLLBACK != 'true'
        run: |
          artifact_repository="${ARTIFACT_REPOSITORY:-$TEAM_PREFIX}"
          image_name="${IMAGE_NAME:-$TEAM_PREFIX}"
          service_name="${SERVICE_NAME:-$TEAM_PREFIX}"
          migration_job_name="${MIGRATION_JOB_NAME:-${TEAM_PREFIX}-migrate}"
          for resource_name in "$artifact_repository" "$image_name" "$service_name" "$migration_job_name"; do
            [[ "$resource_name" == "$TEAM_PREFIX"* ]] || { echo "Resource is outside this team's prefix." >&2; exit 1; }
          done
          gcloud artifacts repositories describe "$artifact_repository" --location "$REGION" --project "$PROJECT_ID" >/dev/null
          image="$REGION-docker.pkg.dev/$PROJECT_ID/$artifact_repository/$image_name:$IMAGE_TAG"
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build --tag "$image" .
          docker push "$image"

      - name: Migrate and update the team service
        run: bash deploy/release.sh

      - name: Run the read-only public smoke check
        run: python3 deploy/smoke_test.py "$SERVICE_URL"

      - name: Record the deployed revision
        run: |
          {
            echo "### SurveyHub deployment"
            echo "- Source commit: $IMAGE_TAG"
            echo "- Image: $DEPLOYED_IMAGE"
            echo "- Rollback: $ROLLBACK"
            echo "- Service URL: $SERVICE_URL"
            echo "- Smoke check: passed"
          } >> "$GITHUB_STEP_SUMMARY"
